[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NETLIFY = "true"
  VITE_BASE_PATH = "/"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
